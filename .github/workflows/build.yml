name: Build Desktop Application

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux GUI & Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libx11-xcb1 \
            libsm6 \
            libice6

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (Ruff)
        run: uv run ruff check src tests

      - name: Test (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

  build:
    name: Build (${{ matrix.platform-name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M 系列)
          - os: macos-latest
            platform-name: macos-arm64
          # macOS Intel (x86_64)
          - os: macos-13
            platform-name: macos-x86_64
          # Windows (x64)
          - os: windows-latest
            platform-name: windows-x64
          # Linux (x86_64，使用 ubuntu-22.04 保证兼容广泛的 glibc 版本)
          - os: ubuntu-22.04
            platform-name: linux-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux GUI & Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libx11-xcb1 \
            libsm6 \
            libice6

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Verify desktop environment
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q tests/test_desktop.py

      - name: Build desktop app with PyInstaller
        run: uv run pyinstaller --noconfirm nova-canvas.spec

      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          # 1. 创建 dmg 磁盘映像 (挂载即用)
          hdiutil create -volname "NovaCanvas" -srcfolder "dist/NovaCanvas.app" -ov -format UDZO "NovaCanvas-${{ matrix.platform-name }}.dmg"
          # 2. 压缩 app 为 zip (保留 macOS bundle 扩展属性与软链接)
          ditto -c -k --keepParent "dist/NovaCanvas.app" "NovaCanvas-${{ matrix.platform-name }}.zip"

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\NovaCanvas" -DestinationPath "NovaCanvas-${{ matrix.platform-name }}.zip"

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf "NovaCanvas-${{ matrix.platform-name }}.tar.gz" -C dist NovaCanvas

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaCanvas-${{ matrix.platform-name }}
          path: NovaCanvas-${{ matrix.platform-name }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display release assets
        run: ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
